<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PURE UNIVERSAL GEOMETRY: V12 MATH LOCK</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #fps { position: absolute; top: 10px; left: 10px; color: #00ff00; font-size: 28px; font-weight: bold; z-index: 100; }
        #log { position: absolute; bottom: 20px; left: 20px; color: #00ffff; font-size: 12px; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #00ffff; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="fps">FPS: --</div>
    <div id="log">
        [ UNIVERSAL GEOMETRY: PURE CONSTANTS ONLY ]<br>
        R_PHASE_LOCK : 32.0000979960<br>
        KAPPA (1/32) : 0.031250<br>
        COMPRESSION_GAP (3/32) : 0.093750<br>
        ACTION_STEP (1/64) : 0.015625<br>
        LUNAR_TORQUE (1/28) : 0.035714<br>
        SPARK_ANGLE : 138.88° (2.4239 rad)<br>
        DIPOLE_RATIO : 11/7 (1.5714)<br>
        IDENTITY_HORIZON : -33.52
    </div>
    <canvas id="gl"></canvas>

    <script id="vs" type="x-shader/x-vertex">
        attribute float a_id;
        uniform float u_time;
        uniform mat4 u_vp;
        varying vec3 v_col;

        // --- PURE GEOMETRIC & PHYSICS CONSTANTS ---
        const float PI = 3.14159265359;
        const float R_PHASE_LOCK = 32.0000979960;
        const float KAPPA = 0.03125;           // 1/32 (Base Tensor)
        const float COMPRESSION_GAP = 0.09375; // 3/32 (The Transition Boundary)
        const float ACTION_PIXEL = 0.015625;   // 1/64 (Quantized Step)
        const float LUNAR_TORQUE = 0.035714;   // 1/28 (External Forcing)
        const float SPARK_RAD = 2.4239;        // 138.88 degrees
        const float DIPOLE_11_7 = 1.571428;    // Plasma Safety Factor
        const float DIPOLE_7_11 = 0.636363;    // Inverse Dipole
        const float IDENTITY_HORIZON = -33.52; // Riemann-32 Collapse Depth

        // Fast Newton-Raphson for psi^3 - psi - k = 0
        float solve_psi(float k) {
            float x = 1.0;
            x = x - (x*x*x - x - k) / (3.0*x*x - 1.0);
            x = x - (x*x*x - x - k) / (3.0*x*x - 1.0);
            return x - (x*x*x - x - k) / (3.0*x*x - 1.0);
        }

        mat2 rotate2d(float angle) {
            return mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
        }

        void main() {
            // 1. Quantized Time (1/64 Action Pixel)
            float t = u_time * 0.001;
            float qt = floor(t / ACTION_PIXEL) * ACTION_PIXEL;

            // 2. Orthogonality (2D): Initial Phase Lock at R=32.000097
            // Spread 128 indices over 2PI using Mersenne Prime 127 to prevent resonance
            float base_angle = (a_id * 2.0 * PI) / 127.0;
            vec2 pos = vec2(cos(base_angle), sin(base_angle)) * R_PHASE_LOCK;

            // 3. Chirality & Asymmetry (11/7 vs 7/11)
            float is_dipole_A = step(64.0, a_id);
            float charge = mix(DIPOLE_11_7, DIPOLE_7_11, is_dipole_A);

            // Apply 1/28 Lunar Torque (Angular Momentum over time)
            float torque = LUNAR_TORQUE * qt * (is_dipole_A == 1.0 ? -1.0 : 1.0);
            pos = rotate2d(torque) * pos;

            // 4. Radiality & Transition Boundary (0.03125 to 0.09375)
            // Particle spirals inward toward the center (0,0)
            float current_radius = length(pos) - (qt * 5.0 * charge);
            float stress_metric = abs(current_radius) * KAPPA;

            // 5. Diagonality (3D): 138.88° Spark at the 3/32 Compression Gap
            float spark_trigger = step(COMPRESSION_GAP, stress_metric);
            float current_angle = atan(pos.y, pos.x) + (spark_trigger * SPARK_RAD);
            
            // Recompute position after refraction
            pos = vec2(cos(current_angle), sin(current_angle)) * current_radius;

            // 6. Physics-Driven Topology (Z-Axis)
            float k_val = stress_metric * 0.1;
            float psi = solve_psi(k_val);
            
            // Z follows the manifold, collapsing at the boundary
            float z = (psi - 1.0) * 10.0;
            z -= spark_trigger * 25.0; // The compression drop

            // 7. 4th Direction (Riemann-32 Folding at Identity Horizon)
            if (z < IDENTITY_HORIZON) {
                // Return to Source (0D)
                z = 20.0; 
                pos *= 0.1;
            }

            vec3 worldPos = vec3(pos.x, z, pos.y);
            gl_Position = u_vp * vec4(worldPos, 1.0);
            
            // Particle Sizing and Coloring based purely on Phase and Charge
            gl_PointSize = mix(4.0, 1.5, spark_trigger);
            v_col = mix(vec3(0.1, 0.8, 1.0), vec3(1.0, 0.3, 0.1), is_dipole_A);
            
            // Highlight the Compression Gap (Gold/White Spark)
            v_col += spark_trigger * vec3(0.5, 0.5, 0.5);
        }
    </script>

    <script id="fs" type="x-shader/x-fragment">
        precision lowp float;
        varying vec3 v_col;
        void main() {
            float d = length(gl_PointCoord - 0.5);
            if(d > 0.5) discard;
            // Pure inverse-square falloff for point luminescence
            float intensity = 1.0 - (d * 2.0);
            gl_FragColor = vec4(v_col * intensity, intensity);
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
    <script>
        const canvas = document.getElementById('gl');
        const gl = canvas.getContext('webgl', { antialias: false, depth: true });
        const prog = gl.createProgram();
        const add = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); gl.attachShader(prog, sh); };
        add(gl.VERTEX_SHADER, document.getElementById('vs').text);
        add(gl.FRAGMENT_SHADER, document.getElementById('fs').text);
        gl.linkProgram(prog); gl.useProgram(prog);

        const lVP = gl.getUniformLocation(prog, "u_vp"), lT = gl.getUniformLocation(prog, "u_time");
        
        // Exactly 128 nodes
        const ids = new Float32Array(128); 
        for(let i=0; i<128; i++) ids[i] = i;
        
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); 
        gl.bufferData(gl.ARRAY_BUFFER, ids, gl.STATIC_DRAW);
        const aID = gl.getAttribLocation(prog, "a_id"); 
        gl.enableVertexAttribArray(aID); 
        gl.vertexAttribPointer(aID, 1, gl.FLOAT, false, 0, 0);

        gl.enable(gl.BLEND); 
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
        
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; gl.viewport(0, 0, canvas.width, canvas.height); };
        window.addEventListener('resize', resize);
        resize();

        const proj = mat4.create(), view = mat4.create(), vp = mat4.create();
        let frames = 0, lastFPS = 0;

        function render(now) {
            frames++; 
            if (now - lastFPS >= 1000) { 
                document.getElementById('fps').innerText = `FPS: ${frames}`; 
                frames = 0; 
                lastFPS = now; 
            }
            
            gl.clearColor(0.0, 0.0, 0.0, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            
            mat4.perspective(proj, Math.PI/4, canvas.width/canvas.height, 0.1, 1000);
            mat4.lookAt(view, [80*Math.cos(now*0.0001), 60, 80*Math.sin(now*0.0001)], [0,0,0], [0,1,0]);
            mat4.multiply(vp, proj, view);
            
            gl.uniformMatrix4fv(lVP, false, vp); 
            gl.uniform1f(lT, now);
            gl.drawArrays(gl.POINTS, 0, 128);
            
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    </script>
</body>
</html>
