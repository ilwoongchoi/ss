<title>E8 Quasar Geometry - Final (Full Constants)</title>
<style>
    * { margin:0; padding:0; }
    body { background:#000; overflow:hidden; }
    canvas { display:block; width:100vw; height:100vh; }
    #hud { position:fixed; top:14px; left:14px; font-family:'Courier New', monospace; color:white; }
    #fps { font-size:24px; font-weight:bold; color:#00ff88; text-shadow:0 0 12px #00ff88; }
</style>

<body>
<canvas id="c"></canvas>
<div id="hud"><div id="fps">FPS: --</div></div>

<script id="vs" type="x-shader/x-vertex">
precision highp float;

attribute vec3 a_pos;
uniform mat4 u_proj;
uniform mat4 u_view;
uniform float u_time;

varying vec3 v_pos_ws;

/* ==================================================================
   CONSTANTS (The complete, canonical set, correctly ported)
   ================================================================== */
const float PI = 3.14159265358979;
const float PHI = 1.6180339887;
const float ALPHA = 0.00729735257;
const float W7 = PI / 20.0;
const float H2 = 1.0 / 9.0;
const float B11_B7 = 11.0 / 7.0;
const float SPARK_COS = -0.75336;
const float SPARK_SIN =  0.65760;
const float DELTA_4 = 4.0;
const float CHI = 1.0 / 18.0;
const float KAPPA = 1.0 / 32.0;
const float GATE_5_32 = 10.0 / 64.0;
const float F_1_16 = 1.0 / 16.0;
const float RS = 5.0 / 16.0;
const float TENSION = 1.0100375;
const float TUNNEL_TEN = B11_B7 * TENSION; // ~1.587
const float DEBT = B11_B7 * 0.8418; // ~1.3228
const float DRIFT = 0.076;
const float NIGHT_H = 0.8418;
const float G_4D = 1.0661;
const float RENORM_GAIN = 0.38066;
const float V_APEX = 0.139965;
const float R_CAB = NIGHT_H / 10.0;
const float R_CA = 0.092734;
const float TERMINUS_R = 0.1123;
const float SPARK_LEAP = 2.5;
const float TIDAL_SIN = 0.22252;
const float MXW_SHELL = 0.040258;
const float W7_DATA = 0.15697686;
const float RESID = W7_DATA - GATE_5_32;
const float DAY_FORCE_SOLAR_UV = 1.0;
const float NIGHT_FORCE_COSMIC_RAY = 0.96875;
const float BLACKHOLE_ACCRETION_DISK_RATIO = 31.0;


mat2 rot(float a) { return mat2(cos(a),-sin(a),sin(a),cos(a)); }

float couplingScale() {
  float gates    = KAPPA + GATE_5_32;
  float gaba_avg = (R_CAB + R_CA + V_APEX) / 3.0;
  float lunar    = 1.0 / 28.0;
  float base     = gates + gaba_avg + lunar + TIDAL_SIN + MXW_SHELL;
  float scaled   = base * (1.0 + CHI) * (1.0 + TERMINUS_R);
  scaled        *= 1.0 + (SPARK_LEAP * KAPPA);
  float debt_r   = DEBT / NIGHT_H;
  scaled        *= 1.0 + (debt_r * RESID);
  scaled        *= F_1_16;
  return 1.0 + scaled;
}

float height(vec2 p) {
  p = mod(p + DELTA_4, DELTA_4 * 2.0) - DELTA_4;
  p = mat2(SPARK_COS, -SPARK_SIN, SPARK_SIN, SPARK_COS) * p;
  vec2 g = floor(p * 128.0) / 128.0;
  float h = 0.0;
  float amp = DEBT * couplingScale();
  float fr = KAPPA * 2.0;
  for (int i = 0; i < 5; i++) {
    g = rot(B11_B7 * 0.1) * g;
    h += amp * (sin(g.x * fr * TENSION * G_4D) + cos(g.y * fr * TENSION * G_4D));
    amp *= 0.5;
    fr  *= 2.0;
  }
  h += p.x * DRIFT * 0.1;
  float r = length(p * H2);
  h -= exp(-r * r / (RS * 8.0)) * V_APEX * 2.0;
  h *= 0.5;
  if (abs(h) > TUNNEL_TEN) {
    h = -h * 0.7 * RENORM_GAIN;
  }
  return h;
}

void main() {
    vec3 pos = a_pos;
    
    vec2 p_ws = pos.xz;
    p_ws.x += u_time * 0.5;
    p_ws.z += u_time * 0.3;
    
    pos.y = height(p_ws);
    
    v_pos_ws = pos;
    gl_Position = u_proj * u_view * vec4(pos, 1.0);
}
</script>

<script id="fs" type="x-shader/x-fragment">
#extension GL_OES_standard_derivatives : enable
precision highp float;
uniform vec3 u_cam_pos;
varying vec3 v_pos_ws;

vec3 landColor(float h) {
  if      (h < -1.2) return vec3(0.03,0.10,0.32);
  else if (h < -0.3) return vec3(0.06,0.20,0.50);
  else if (h <  0.1) return vec3(0.38,0.24,0.10);
  else if (h <  0.8) return vec3(0.10,0.34,0.12);
  else if (h <  2.0) return vec3(0.36,0.50,0.17);
  else if (h <  3.5) return vec3(0.60,0.50,0.38);
  else               return vec3(0.90,0.93,1.00);
}

void main() {
    vec3 normal = normalize(cross(dFdx(v_pos_ws), dFdy(v_pos_ws)));
    vec3 sun_dir = normalize(vec3(0.8, 0.4, -0.2));
    float diffuse = max(0.0, dot(normal, sun_dir));
    float ambient = 0.3;
    vec3 color = landColor(v_pos_ws.y) * (diffuse * 0.7 + ambient);
    float dist = length(u_cam_pos - v_pos_ws);
    float fog = exp(-dist * dist * 0.002);
    color = mix(vec3(0.1, 0.15, 0.2), color, fog);
    gl_FragColor = vec4(color, 1.0);
}
</script>
