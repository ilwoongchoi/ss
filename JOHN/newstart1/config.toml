# Universal Operator Control Profiles
#
# This file is NOT a personality profile.
# It defines the input u(t) for the operator: per-gate "on/off/no_control"
# by regime (outside/hysteresis) and persona (user/people).
#
# Values:
# - "on"         : actively / consciously ON
# - "off"        : actively / consciously OFF
# - "no_control" : let-go / unconscious / do not intervene
#
# Regimes:
# - outside     : outside hysteresis window
# - hysteresis  : inside hysteresis window (default 01:30-03:00)
#
# Note:
# Physics/structure (motif weights, alpha, G_F, 0.2828, 5/32, 138.88) are fixed in code.
# Only these per-regime inputs are meant to change here.

