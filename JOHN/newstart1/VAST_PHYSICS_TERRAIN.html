<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="fps" style="position: absolute; top: 10px; left: 10px; color: #0f0; font-family: monospace; background: rgba(0,0,0,0.8); padding: 5px 10px; border: 1px solid #0f0; z-index: 1000; pointer-events: none;">FPS: --</div>
    <canvas id="c"></canvas>
    <script id="vs" type="x-shader/x-vertex">#version 300 es
        void main() {
            vec2 pos[3] = vec2[](vec2(-1,-1), vec2(3,-1), vec2(-1,3));
            gl_Position = vec4(pos[gl_VertexID], 0, 1);
        }
    </script>
    <script id="fs" type="x-shader/x-fragment">#version 300 es
        precision highp float;
        uniform float time;
        uniform vec2 res;
        out vec4 outColor;

        // --- PURE FRAMEWORK PHYSICS ---
        #define PI 3.14159265359
        #define TENSION 1.0100375
        #define METRIC_4D 1.0661
        #define TORSION_4D 0.1746
        #define K_3_32 0.09375

        // Hardware-Direct Noise (Perlin-ish)
        float hash(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
        }

        float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
        }

        float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 5; i++) {
                v += a * noise(p);
                p *= 2.0;
                a *= 0.5;
            }
            return v;
        }

        // Terrain Mapping using Physics
        float map(vec3 p) {
            // Transform world coords to 16x16 Grid space
            vec2 grid = p.xz * 0.2;
            
            // 1. Base Perlin Elevation
            float h = fbm(grid) * 4.0;
            
            // 2. Separatrix Ridges (X=5, X=11)
            float ridge_l = 1.0 / (abs(grid.x - 5.0) + 0.5);
            float ridge_r = 1.0 / (abs(grid.x - 11.0) + 0.5);
            h += (ridge_l + ridge_r) * 2.0 * TENSION;
            
            // 3. PLP Spine Valley
            float spine = abs((grid.x + grid.y) - 16.0);
            h -= 1.0 / (spine + 1.0) * METRIC_4D;

            return p.y - h;
        }

        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * res.xy) / res.y;
            
            // Camera (Quasar Orbit)
            vec3 ro = vec3(8.0 + 10.0 * cos(time * 0.1), 12.0, 8.0 + 10.0 * sin(time * 0.1));
            vec3 target = vec3(8.0, 2.0, 8.0);
            vec3 ww = normalize(target - ro);
            vec3 uu = normalize(cross(vec3(0, 1, 0), ww));
            vec3 vv = cross(ww, uu);
            vec3 rd = normalize(uv.x * uu + uv.y * vv + 1.5 * ww);

            // Raymarching (Physics of light)
            float t = 0.0;
            for (int i = 0; i < 80; i++) {
                vec3 p = ro + rd * t;
                float d = map(p);
                if (d < 0.01 || t > 50.0) break;
                t += d;
            }

            vec3 p = ro + rd * t;
            vec2 grid = p.xz * 0.2;
            
            // Colouring based on Metabolic Phase
            vec3 col = vec3(0.0);
            if (t < 50.0) {
                // Height-based colorful palette
                col = 0.5 + 0.5 * cos(p.y * 0.5 + vec3(0, 2, 4) + time);
                
                // Separatrix Glow
                float s_glow = smoothstep(0.8, 1.0, 1.0 / (abs(grid.x - 5.0) + 0.5)) +
                               smoothstep(0.8, 1.0, 1.0 / (abs(grid.x - 11.0) + 0.5));
                col += vec3(0.0, 1.0, 0.0) * s_glow;
                
                // Spine Metabolic River
                float spine_glow = smoothstep(0.9, 1.0, 1.0 / (abs((grid.x + grid.y) - 16.0) + 0.5));
                col += vec3(1.0, 0.5, 0.0) * spine_glow * 2.0;

                // Lighting
                col *= exp(-0.05 * t); // Fog
            } else {
                // Quasar Sky
                col = vec3(0.02, 0.02, 0.05);
                // Spark Discharges
                if (hash(uv + time) > 0.998) col += vec3(1.0, 0.5, 1.0) * TORSION_4D * 5.0;
            }

            outColor = vec4(col, 1.0);
        }
    </script>
    <script>
        const gl = c.getContext('webgl2');
        const program = gl.createProgram();
        [vs, fs].forEach(s => {
            const sh = gl.createShader(s.type === 'x-shader/x-vertex' ? gl.VERTEX_SHADER : gl.FRAGMENT_SHADER);
            gl.shaderSource(sh, s.text);
            gl.compileShader(sh);
            gl.attachShader(program, sh);
        });
        gl.linkProgram(program);
        gl.useProgram(program);
        
        const tLoc = gl.getUniformLocation(program, 'time');
        const rLoc = gl.getUniformLocation(program, 'res');
        
        let frames = 0;
        let lastFpsUpdate = 0;

        function draw(t) {
            frames++;
            if (t - lastFpsUpdate >= 1000) {
                fps.innerText = `FPS: ${Math.round(frames * 1000 / (t - lastFpsUpdate))}`;
                frames = 0;
                lastFpsUpdate = t;
            }

            gl.uniform1f(tLoc, t * 0.001);
            gl.uniform2f(rLoc, innerWidth, innerHeight);
            gl.viewport(0, 0, c.width = innerWidth, c.height = innerHeight);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            requestAnimationFrame(draw);
        }
        draw(0);
    </script>
</body>
</html>
