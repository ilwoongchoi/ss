<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; overflow: hidden; cursor: crosshair; }
        canvas { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="fps" style="position: absolute; top: 10px; left: 10px; color: #0f0; font-family: monospace; background: rgba(0,0,0,0.8); padding: 5px 10px; border: 1px solid #0f0; z-index: 1000; pointer-events: none;">FPS: --</div>
    <canvas id="c"></canvas>
    <script id="vs" type="x-shader/x-vertex">#version 300 es
        void main() {
            vec2 pos[3] = vec2[](vec2(-1,-1), vec2(3,-1), vec2(-1,3));
            gl_Position = vec4(pos[gl_VertexID], 0, 1);
        }
    </script>
    <script id="fs" type="x-shader/x-fragment">#version 300 es
        precision highp float;
        uniform float time;
        uniform vec2 res;
        out vec4 outColor;

        // --- PURE FRAMEWORK PHYSICS ---
        #define PI 3.14159265359
        #define SPARK_ANGLE 2.4239 // 138.88°
        #define TENSION 1.0100375
        #define METRIC_4D 1.0661
        #define TORSION_4D 0.1746
        #define K_3_32 0.09375
        
        void main() {
            // Hardware-Direct Coordinate Mapping
            vec2 p = gl_FragCoord.xy / res.xy * 16.0; 
            
            // 1. THE 3-BASIN TOPOLOGY (The Separatrices)
            float basins = sin(p.x - 5.0) * sin(p.x - 11.0);
            
            // 2. THE PLP DIAGONAL SPINE (Metabolic Equilibrium)
            float spine = abs((p.x + p.y) - 16.0);
            
            // 3. MANDELBROT CORE (The Fractal Engine)
            vec2 z = (p - 8.0) / 4.0;
            vec2 c = vec2(0.618 * cos(time * 0.1), 0.618 * sin(time * 0.1)) + 0.1618;
            vec2 z2 = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + c;
            
            // 4. PHYSICS FIELD DYNAMICS
            vec2 flow = (z2 - z) * TORSION_4D * METRIC_4D * TENSION;
            
            // 5. THE 138.88° SPARK (Hysteresis Overcoming)
            // Visualizing the spark as a phase-shift in the manifold
            float stress = length(flow);
            float spark_zone = step(K_3_32, stress) * step(4.0, p.x) * step(p.x, 12.0);
            
            // Render: The Manifold
            vec3 col = vec3(0.0);
            
            // Draw Separatrices (Physical Ridges)
            col += vec3(0.0, 1.0, 0.0) * (1.0 - smoothstep(0.0, 0.1, abs(p.x - 5.0)));
            col += vec3(0.0, 1.0, 0.0) * (1.0 - smoothstep(0.0, 0.1, abs(p.x - 11.0)));
            
            // Draw Spine (The Nerve)
            col += vec3(1.0, 0.5, 0.0) * (1.0 - smoothstep(0.0, 0.1, spine));
            
            // Draw Physics Flow
            col.rb += flow * 0.5 + 0.5;
            
            // Apply Spark Flash (The Hysteresis Discharge)
            col += vec3(1.0, 0.0, 1.0) * spark_zone * fract(time - p.y * 0.5);

            // Final Output: Pure Connection
            outColor = vec4(col * (0.5 + 0.5 * basins), 1.0);
        }
    </script>
    <script>
        const gl = c.getContext('webgl2');
        const program = gl.createProgram();
        [vs, fs].forEach(s => {
            const sh = gl.createShader(s.type === 'x-shader/x-vertex' ? gl.VERTEX_SHADER : gl.FRAGMENT_SHADER);
            gl.shaderSource(sh, s.text);
            gl.compileShader(sh);
            gl.attachShader(program, sh);
        });
        gl.linkProgram(program);
        gl.useProgram(program);
        
        const tLoc = gl.getUniformLocation(program, 'time');
        const rLoc = gl.getUniformLocation(program, 'res');
        
        let lastT = 0;
        let frames = 0;
        let lastFpsUpdate = 0;

        function draw(t) {
            // FPS Calculation
            frames++;
            if (t - lastFpsUpdate >= 1000) {
                fps.innerText = `FPS: ${Math.round(frames * 1000 / (t - lastFpsUpdate))}`;
                frames = 0;
                lastFpsUpdate = t;
            }

            gl.uniform1f(tLoc, t * 0.001);
            gl.uniform2f(rLoc, innerWidth, innerHeight);
            gl.viewport(0, 0, c.width = innerWidth, c.height = innerHeight);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            requestAnimationFrame(draw);
        }
        draw(0);
    </script>
</body>
</html>
