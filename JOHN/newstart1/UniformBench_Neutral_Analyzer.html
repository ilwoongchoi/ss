<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UniformBench — High-Load Bandwidth Analyzer</title>
    <style>
        :root { --bg: #050505; --accent: #10b981; --text: #f1f5f9; --border: #1e1e1e; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; overflow: hidden; }
        
        #ui {
            position: absolute; top: 20px; left: 20px; width: 340px;
            background: rgba(0,0,0,0.9); border: 1px solid var(--border);
            padding: 20px; box-shadow: 0 0 20px rgba(0,255,0,0.1); z-index: 100;
        }
        h1 { font-size: 14px; margin: 0 0 15px 0; color: var(--accent); letter-spacing: 2px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .metric { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; }
        .val { font-weight: bold; color: #fff; }
        
        .stress-control { margin: 20px 0; padding: 15px; background: #111; border: 1px solid #333; }
        .stress-label { font-size: 10px; color: #888; display: block; margin-bottom: 5px; }
        input[type=range] { width: 100%; cursor: pointer; }

        .grade-box { text-align: center; padding: 15px; margin-top: 15px; border: 1px solid var(--border); background: #0a0a0a; }
        #grade { font-size: 48px; font-weight: 900; }
        
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>VRAM BANDWIDTH HAMMER</h1>
        
        <div class="stress-control">
            <span class="stress-label">VRAM LOAD MULTIPLIER: <b id="stress-val">1</b></span>
            <input type="range" id="stress-slider" min="1" max="200" value="1">
            <span style="font-size: 9px; color: #555;">Testing shared memory saturation...</span>
        </div>

        <div class="metric"><span>Jitter (ms):</span> <span id="jitter" class="val">0.000</span></div>
        <div class="metric"><span>Temporal Gap:</span> <span id="gap" class="val">0.00ms</span></div>
        
        <div class="grade-box">
            <span style="font-size: 10px; color: var(--accent);">REAL-TIME INTEGRITY</span>
            <div id="grade">--</div>
        </div>
    </div>

    <canvas id="c"></canvas>

    <script id="vs" type="x-shader/x-vertex">#version 300 es
        void main() {
            vec2 p[3] = vec2[](vec2(-1,-1), vec2(3,-1), vec2(-1,3));
            gl_Position = vec4(p[gl_VertexID], 0, 1);
        }
    </script>

    <script id="fs" type="x-shader/x-fragment">#version 300 es
        precision highp float;
        uniform float u_time;
        uniform vec2 u_res;
        uniform int u_stress;
        out vec4 fragColor;

        void main() {
            vec2 uv = gl_FragCoord.xy / u_res.xy;
            float h = 0.0;
            
            // THE BANDWIDTH HAMMER
            // Forces the GPU to perform thousands of trigonometric calculations 
            // per pixel to saturate the instruction buffer and memory bus.
            for(int i=0; i<u_stress; i++) {
                h += sin(uv.x * 100.0 + u_time + float(i)) * cos(uv.y * 100.0 - u_time * float(i) * 0.1);
                h = fract(h * 1.618); // Numerical scrambling
            }
            
            vec3 col = 0.5 + 0.5 * cos(h * 6.28 + vec3(0, 2, 4));
            fragColor = vec4(col, 1.0);
        }
    </script>

    <script>
        const canvas = document.getElementById('c');
        const gl = canvas.getContext('webgl2');
        const slider = document.getElementById('stress-slider');
        
        const createShader = (type, src) => {
            const s = gl.createShader(type);
            gl.shaderSource(s, src); gl.compileShader(s);
            return s;
        };
        const prog = gl.createProgram();
        gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs.text));
        gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs.text));
        gl.linkProgram(prog); gl.useProgram(prog);

        const tLoc = gl.getUniformLocation(prog, 'u_time');
        const rLoc = gl.getUniformLocation(prog, 'u_res');
        const sLoc = gl.getUniformLocation(prog, 'u_stress');

        let frameHistory = [];
        let lastTime = performance.now();

        function draw(t) {
            const now = performance.now();
            const delta = now - lastTime;
            lastTime = now;
            
            // Tightened Analysis for High Performance Hardware
            frameHistory.push(delta);
            if(frameHistory.length > 30) frameHistory.shift();
            const avg = frameHistory.reduce((a,b)=>a+b)/frameHistory.length;
            const variance = frameHistory.reduce((a,b)=>a+Math.pow(b-avg,2),0)/frameHistory.length;
            const jitter = Math.sqrt(variance);
            
            // Grade Thresholds (Tightened)
            let grade = 'S';
            if (jitter > 0.5 || delta > 17.5) grade = 'A';
            if (jitter > 1.5 || delta > 25.0) grade = 'B';
            if (jitter > 4.0 || delta > 40.0) grade = 'C';
            if (delta > 80.0) grade = 'F';

            // Update UI
            document.getElementById('stress-val').innerText = slider.value;
            document.getElementById('jitter').innerText = jitter.toFixed(3);
            document.getElementById('gap').innerText = (delta - 16.66).toFixed(2) + 'ms';
            const gradeEl = document.getElementById('grade');
            gradeEl.innerText = grade;
            
            // Color mapping
            if (grade === 'S') gradeEl.style.color = '#10b981';
            else if (grade === 'A') gradeEl.style.color = '#34d399';
            else if (grade === 'B') gradeEl.style.color = '#f59e0b';
            else gradeEl.style.color = '#ef4444';

            // RENDER
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.uniform1f(tLoc, t * 0.001);
            gl.uniform2f(rLoc, canvas.width, canvas.height);
            gl.uniform1i(sLoc, parseInt(slider.value));
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
    </script>
</body>
</html>
