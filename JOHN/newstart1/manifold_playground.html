<!DOCTYPE html>
<html>
<head>
    <title>THE CLOSED REALITY: 128-GRID DETERMINISTIC ENGINE</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #ffd200; font-family: 'Courier New', monospace;
            background: rgba(5, 5, 16, 0.95); padding: 25px;
            border-left: 4px solid #3b6cff; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <b style="font-size: 1.5rem; color: #3b6cff;">MANIFOLD ARCHITECT: SINGULARITY</b><br>
        TENSION: 1.0100375 (REALITY)<br>
        CLOSURE: 1.0000424 (DISCRETE)<br>
        LUNAR BRIDGE: 32-28 = 4 (DELTA)<br>
        SPARK: 138.88&deg; | BIFURCATION: 0%<br>
        <hr style="border:0; border-top:1px solid #333; margin: 15px 0;">
        FPS: <span id="fps">--</span> | 60FPS NATIVE STABILITY
    </div>
    <canvas id="c"></canvas>

    <script id="vs" type="x-shader/x-vertex">
        attribute vec2 a_pos;
        uniform float u_time;
        varying vec3 v_color;

        // Reality Tension (Discrete/Reality)
        const float T = 1.0100375;
        // Discrete Closure (Discrete/Continuous)
        const float C = 1.0000424;

        void main() {
            // [OPTIMIZED] Pre-scaled position
            vec3 p = vec3(a_pos.x * 10.0, 0.0, a_pos.y * 10.0);
            
            // [1] 4-ZONE CHARGE (GABA -0.5, ACh 1.0, Glu 0.5, 5HT 1.5)
            float charge = (p.x < -3.2) ? -0.5 : (p.x < 0.0) ? 1.0 : (p.x < 3.2) ? 0.5 : 1.5;
            vec3 zone_col = (p.x < -3.2) ? vec3(0.1) : (p.x < 0.0) ? vec3(0.0, 0.8, 0.4) : (p.x < 3.2) ? vec3(0.9, 0.4, 0.0) : vec3(0.0, 0.4, 0.9);

            // [2] GEOMETRY CLOSURE
            p.x += p.z * 0.5;
            p.z *= 0.866;

            // Wave period modulated by Reality (T) and Discrete Closure (C)
            float wave = sin(p.x * 0.5236 * T * C + u_time); 
            p.y = wave * charge * 2.0;

            // [3] PROJECTION
            float z_view = p.z + 25.0;
            gl_Position = vec4(p.x / z_view, (p.y - 8.0) / z_view, 0.0, 1.0);
            
            // Apply T and C to point size
            gl_PointSize = (2.5 + charge) * (20.0 / z_view) * T * C;

            v_color = mix(zone_col, vec3(0.7, 0.0, 0.0), 0.25);
        }
    </script>

    <script id="fs" type="x-shader/x-fragment">
        precision lowp float; // Use lowp for maximum speed
        varying vec3 v_color;
        void main() {
            // [MAX OPTIMIZATION] Hard edge circle, no smoothstep
            vec2 c = gl_PointCoord - 0.5;
            if (dot(c, c) > 0.2) discard; 
            gl_FragColor = vec4(v_color, 0.9);
        }
    </script>

    <script>
        const c = document.getElementById('c');
        // [PERFORMANCE] desynchronized: true for lower latency/higher FPS
        const gl = c.getContext('webgl', { 
            powerPreference: "high-performance", 
            alpha: false, 
            antialias: false,
            depth: false,
            preserveDrawingBuffer: false,
            desynchronized: true
        });
        
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        
        const prog = gl.createProgram();
        [ ['vs', gl.VERTEX_SHADER], ['fs', gl.FRAGMENT_SHADER] ].forEach(([id, type]) => {
            const s = gl.createShader(type); gl.shaderSource(s, document.getElementById(id).text);
            gl.compileShader(s); gl.attachShader(prog, s);
        });
        gl.linkProgram(prog); gl.useProgram(prog);

        // CREATE 128-GRID (16384 vertices)
        const vertices = [];
        for(let y=-64; y<64; y++) {
            for(let x=-64; x<64; x++) {
                vertices.push(x/16, y/16);
            }
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(prog, 'a_pos');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        const uTime = gl.getUniformLocation(prog, 'u_time');
        const fpsEl = document.getElementById('fps');
        let resize = () => { const w = window.innerWidth, h = window.innerHeight; if(c.width!==w||c.height!==h){ c.width=w; c.height=h; gl.viewport(0,0,w,h); } };
        resize(); window.addEventListener('resize',resize);

        // [OPTIMIZATION] Pre-calc count and init time
        const vertexCount = vertices.length >> 1;
        let acc=0, fc=0, lt = performance.now(); 

        function frame(now) {
            const dt = now - lt; lt = now;
            acc+=dt; fc++;
            if(acc>=500){ fpsEl.innerText = Math.round((fc*1000)/acc); acc=0; fc=0; }
            
            gl.uniform1f(uTime, now * 0.001);
            gl.drawArrays(gl.POINTS, 0, vertexCount);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
</body>
</html>
