<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sovereign Resonance Landscape</title>
<style>
body { margin: 0; overflow: hidden; background: #000; }
canvas { display: block; }
#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  color: #0f0;
  font-family: monospace;
  font-size: 14px;
  background: rgba(0,0,0,0.85);
  padding: 10px;
  border: 1px solid #0f0;
  z-index: 100;
  pointer-events: none;
}
.val { color: #fff; font-weight: bold; }
</style>
</head>
<body>
<div id="ui">
  <div>KERNEL: RESONANCE_V3.1</div>
  <div>SPARK: <span class="val">138.88&deg;</span></div>
  <div>OMEGA: <span class="val">7.4</span></div>
  <div>FPS: <span id="fps" class="val">--</span></div>
</div>
<canvas id="glCanvas"></canvas>
<script>
const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if (!gl) {
  document.body.innerHTML = '<div style="color:red;padding:40px;font-family:monospace;font-size:20px">WebGL not available — enable hardware acceleration in browser settings</div>';
  throw new Error('no webgl');
}
const isGL2 = !!(window.WebGL2RenderingContext && gl instanceof WebGL2RenderingContext);
gl.getExtension('OES_standard_derivatives');
if (!isGL2) gl.getExtension('OES_element_index_uint');

const vertexShader = `
precision highp float;
attribute vec2 a_grid;
uniform mat4 u_viewProj;
uniform float u_time;

const float OMEGA = 7.4;
const float SPARK = 138.88 * 3.14159265 / 180.0;
const float K64 = 1.0 / 64.0;

varying vec3 v_pos;
varying float v_h;

// CONTENT: Perlin Noise / FBM
vec3 hash33(vec3 p) {
  p = vec3(dot(p, vec3(127.1, 311.7, 74.7)),
           dot(p, vec3(269.5, 183.3, 246.1)),
           dot(p, vec3(113.5, 271.9, 124.6)));
  return fract(sin(p) * 43758.5453);
}

float noise(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  float a = dot(hash33(i + vec3(0.,0.,0.)), f - vec3(0.,0.,0.));
  float b = dot(hash33(i + vec3(1.,0.,0.)), f - vec3(1.,0.,0.));
  float c = dot(hash33(i + vec3(0.,1.,0.)), f - vec3(0.,1.,0.));
  float d = dot(hash33(i + vec3(1.,1.,0.)), f - vec3(1.,1.,0.));
  float e = dot(hash33(i + vec3(0.,0.,1.)), f - vec3(0.,0.,1.));
  float f_ = dot(hash33(i + vec3(1.,0.,1.)), f - vec3(1.,0.,1.));
  float g = dot(hash33(i + vec3(0.,1.,1.)), f - vec3(0.,1.,1.));
  float h = dot(hash33(i + vec3(1.,1.,1.)), f - vec3(1.,1.,1.));
  return mix(mix(mix(a,b,u.x), mix(c,d,u.x), u.y),
             mix(mix(e,f_,u.x), mix(g,h,u.x), u.y), u.z);
}

// MECHANISM: Resonance-based sampling (Bypassing Bifurcation)
float terrainHeight(vec2 p) {
  float t = u_time * 0.1;
  
  // Rule: Sample at Spark-determined phase offsets
  float resonance = cos(u_time * K64 + SPARK);
  float prec = 1.0 + resonance * 0.1;

  // Use OMEGA 7.4 as the normalization anchor for the noise amplitude
  vec3 pos = vec3(p.x * 0.05, t, p.y * 0.05);

  // Unrolled FBM for WebGL 1.0 Stability
  float n = 0.0;
  n += 0.500 * noise(pos * prec);
  n += 0.250 * noise(pos * 2.0 * prec);
  n += 0.125 * noise(pos * 4.0 * prec);
  
  // Stability Balance Equation: Ω = pH + 1/Node22 - V_in
  float h = n * OMEGA;
  return h;
}

void main() {
  vec2 p = a_grid * 150.0;
  float h = terrainHeight(p);
  vec3 pos = vec3(p.x, h * 5.0, p.y);
  v_pos = pos;
  v_h = h;
  gl_Position = u_viewProj * vec4(pos, 1.0);
}
`;

const fragmentShader = `#extension GL_OES_standard_derivatives : enable
precision highp float;
varying vec3 v_pos;
varying float v_h;

void main() {
  vec3 N = normalize(cross(dFdx(v_pos), dFdy(v_pos)));
  vec3 L = normalize(vec3(0.5, 1.0, 0.3));
  float diff = max(dot(N, L), 0.0);
  
  vec3 base = mix(vec3(0.1, 0.2, 0.4), vec3(0.4, 0.3, 0.2), smoothstep(-2.0, 2.0, v_h));
  vec3 col = base * (0.4 + 0.6 * diff);
  
  // Fog based on distance to center
  float fog = exp(-0.005 * length(v_pos.xz));
  gl_FragColor = vec4(mix(vec3(0.05, 0.05, 0.1), col, fog), 1.0);
}
`;

function compile(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const err = gl.getShaderInfoLog(s);
    console.error('COMPILE ERROR:', err);
    return null;
  }
  return s;
}

const vs = compile(gl, gl.VERTEX_SHADER, vertexShader);
const fs = compile(gl, gl.FRAGMENT_SHADER, fragmentShader);
if (!vs || !fs) throw new Error('shader compile failed — check console');
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error('LINK ERROR:', gl.getProgramInfoLog(prog));
  throw new Error('program link failed');
}
gl.useProgram(prog);

function buildGrid(res) {
  const v = [];
  const idx = [];
  for(let z=0; z<=res; z++) {
    for(let x=0; x<=res; x++) {
      v.push((x/res)*2.0-1.0, (z/res)*2.0-1.0);
    }
  }
  for(let z=0; z<res; z++) {
    for(let x=0; x<res; x++) {
      const i = z*(res+1)+x;
      idx.push(i, i+res+1, i+1, i+1, i+res+1, i+res+2);
    }
  }
  return {v: new Float32Array(v), i: new Uint32Array(idx), count: idx.length};
}

const mesh = buildGrid(64);
const vb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, mesh.v, gl.STATIC_DRAW);
const ib = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.i, gl.STATIC_DRAW);

const aGrid = gl.getAttribLocation(prog, 'a_grid');
gl.enableVertexAttribArray(aGrid);
gl.vertexAttribPointer(aGrid, 2, gl.FLOAT, false, 0, 0);

const uViewProj = gl.getUniformLocation(prog, 'u_viewProj');
const uTime = gl.getUniformLocation(prog, 'u_time');

let last = performance.now();
let frames = 0;
let fps = 0;

function render(now) {
  const dt = now - last;
  frames++;
  if(dt > 1000) {
    fps = Math.round((frames * 1000) / dt);
    document.getElementById('fps').textContent = fps;
    last = now;
    frames = 0;
  }

  const t = now * 0.001;
  const aspect = canvas.width / canvas.height;
  const proj = new Float32Array([1/Math.tan(0.5)/aspect,0,0,0, 0,1/Math.tan(0.5),0,0, 0,0,-1.00025,-1, 0,0,-0.2,0]);
  const camX = Math.cos(t*0.2)*100.0, camZ = Math.sin(t*0.2)*100.0;
  // Simplified lookAt
  const eye = [camX, 40.0, camZ], target = [0,0,0], up = [0,1,0];
  const z = [eye[0]-target[0], eye[1]-target[1], eye[2]-target[2]];
  const zlen = Math.sqrt(z[0]*z[0]+z[1]*z[1]+z[2]*z[2]);
  z[0]/=zlen; z[1]/=zlen; z[2]/=zlen;
  const x = [up[1]*z[2]-up[2]*z[1], up[2]*z[0]-up[0]*z[2], up[0]*z[1]-up[1]*z[0]];
  const xlen = Math.sqrt(x[0]*x[0]+x[1]*x[1]+x[2]*x[2]);
  x[0]/=xlen; x[1]/=xlen; x[2]/=xlen;
  const y = [z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];
  const view = new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]), -(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]), -(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]), 1]);
  
  // Projection * View
  const vp = new Float32Array(16);
  for(let i=0;i<4;i++) for(let j=0;j<4;j++) for(let k=0;k<4;k++) vp[i*4+j]+=view[i*4+k]*proj[k*4+j];

  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.05, 0.05, 0.1, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.uniformMatrix4fv(uViewProj, false, vp);
  gl.uniform1f(uTime, t);
  gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_INT, 0);
  requestAnimationFrame(render);
}

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
requestAnimationFrame(render);
</script>
</body>
</html>
