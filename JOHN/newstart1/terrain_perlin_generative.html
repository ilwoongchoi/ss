<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perlin Generative Terrain</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05080c; }
  canvas { width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed;
    top: 8px;
    left: 8px;
    color: #d8efff;
    font: 12px/1.35 Consolas, "Courier New", monospace;
    background: rgba(8, 16, 24, 0.82);
    border: 1px solid rgba(110, 190, 255, 0.48);
    padding: 10px 12px;
    white-space: pre;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">initializing...</div>

<script id="vs" type="x-shader/x-vertex">
precision highp float;

attribute vec2 a_grid;
uniform mat4 u_viewProj;
uniform float u_worldScale;
uniform float u_heightScale;
uniform float u_cell;
uniform vec2 u_seed;
uniform vec2 u_offset;

const float LATTICE_128 = 0.0078125;
const float RATIO_5_32 = 0.15625;

varying vec3 v_worldPos;
varying vec3 v_normal;
varying float v_h;
varying float v_slope;

vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
}

float perlin(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);

  float a = dot(hash2(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0));
  float b = dot(hash2(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0));
  float c = dot(hash2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));
  float d = dot(hash2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0));

  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  float s = 0.0;
  float amp = 0.5;
  mat2 m = mat2(1.9, -1.4, 1.4, 1.9);
  for (int i = 0; i < 2; i++) {
    s += amp * perlin(p);
    p = m * p;
    amp *= 0.5;
  }
  return s;
}

float tanhFast(float x) {
  x = clamp(x, -8.0, 8.0);
  float e2 = exp(-2.0 * x);
  return (1.0 - e2) / (1.0 + e2);
}

float terrainHeight(vec2 p) {
  // Low-frequency rolling-hill regime (no sharp guilin spikes)
  vec2 qRaw = p * 0.0036 + u_seed * 0.11;
  vec2 q = floor(qRaw / LATTICE_128 + 0.5) * LATTICE_128;
  float warp = perlin(q * 0.58 + vec2(2.4, 1.8));
  vec2 w = q + vec2(warp, -warp) * 0.7;

  float macro = 1.35 * fbm(w * 0.75);
  float meso  = (0.20 + 0.5 * RATIO_5_32) * perlin(w * 1.55 + vec2(3.7, 9.1));

  // Soft shaping to keep broad hills
  float hills = 0.76 * tanhFast(macro) + 0.24 * tanhFast(meso);
  return hills;
}

void main() {
  vec2 p = a_grid * u_worldScale + u_offset;
  float h0 = terrainHeight(p);

  float e = max(0.45, u_cell * 1.10);
  float hx1 = terrainHeight(p + vec2(e, 0.0));
  float hz1 = terrainHeight(p + vec2(0.0, e));

  float sx = (hx1 - h0) / e;
  float sz = (hz1 - h0) / e;
  vec3 n = normalize(vec3(-sx * u_heightScale, 1.0, -sz * u_heightScale));

  vec3 pos = vec3(p.x, h0 * u_heightScale, p.y);
  v_worldPos = pos;
  v_normal = n;
  v_h = h0;
  v_slope = 1.0 - max(dot(n, vec3(0.0, 1.0, 0.0)), 0.0);
  gl_Position = u_viewProj * vec4(pos, 1.0);
}
</script>

<script id="fs" type="x-shader/x-fragment">
precision mediump float;

varying vec3 v_worldPos;
varying vec3 v_normal;
varying float v_h;
varying float v_slope;

uniform vec3 u_camPos;

void main() {
  vec3 N = normalize(v_normal);
  vec3 L = normalize(vec3(0.42, 0.85, 0.32));
  vec3 V = normalize(u_camPos - v_worldPos);
  vec3 H = normalize(L + V);

  float NoL = max(dot(N, L), 0.0);
  float NoH = max(dot(N, H), 0.0);

  // Terrain palette: water / soil / forest / rock / snow
  vec3 waterDeep  = vec3(0.03, 0.14, 0.30);
  vec3 waterShallow = vec3(0.08, 0.28, 0.45);
  vec3 shoreSoil  = vec3(0.45, 0.35, 0.24);
  vec3 forestLow  = vec3(0.12, 0.30, 0.13);
  vec3 forestHigh = vec3(0.20, 0.42, 0.18);
  vec3 rock       = vec3(0.47, 0.43, 0.39);
  vec3 alpine     = vec3(0.86, 0.87, 0.85);

  float hN = clamp((v_h + 0.28) * 0.58, 0.0, 1.0);
  float steep = smoothstep(0.22, 0.55, v_slope);

  vec3 water = mix(waterDeep, waterShallow, smoothstep(0.02, 0.22, hN));
  vec3 forest = mix(forestLow, forestHigh, smoothstep(0.24, 0.70, hN));

  // Ordered bands ensure visible color everywhere (no accidental near-black gaps)
  vec3 albedo = water;
  albedo = mix(albedo, shoreSoil, smoothstep(0.16, 0.24, hN));
  albedo = mix(albedo, forest, smoothstep(0.24, 0.46, hN));
  albedo = mix(albedo, rock, smoothstep(0.62, 0.80, hN));
  albedo = mix(albedo, alpine, smoothstep(0.86, 0.98, hN));

  // Slope-dependent erosion/rock exposure
  albedo = mix(albedo, rock, 0.55 * steep * smoothstep(0.32, 0.78, hN));

  float waterMask = 1.0 - smoothstep(0.18, 0.26, hN);
  float waterSpec = waterMask * pow(NoH, 34.0) * 0.45;

  vec3 lit = albedo * (0.22 + 0.78 * NoL) + vec3(0.18) * pow(NoH, 18.0) + vec3(0.42, 0.50, 0.60) * waterSpec;

  float d = length(v_worldPos.xz);
  float fog = exp(-0.00035 * d);
  vec3 sky = vec3(0.52, 0.72, 0.92);
  gl_FragColor = vec4(mix(sky, lit, fog), 1.0);
}
</script>

<script>
(function () {
  var canvas = document.getElementById("gl");
  var hud = document.getElementById("hud");
  var gl = canvas.getContext("webgl", {
    antialias: false,
    alpha: false,
    depth: true,
    stencil: false,
    powerPreference: "high-performance"
  }) || canvas.getContext("experimental-webgl");

  if (!gl) {
    hud.textContent = "WebGL unavailable.";
    return;
  }

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      return { shader: null, error: gl.getShaderInfoLog(s) || "shader compile error" };
    }
    return { shader: s, error: null };
  }

  function makeProgram(vsSrc, fsSrc) {
    var v = compile(gl.VERTEX_SHADER, vsSrc);
    if (!v.shader) return { program: null, error: "VS: " + v.error };
    var f = compile(gl.FRAGMENT_SHADER, fsSrc);
    if (!f.shader) return { program: null, error: "FS: " + f.error };
    var p = gl.createProgram();
    gl.attachShader(p, v.shader);
    gl.attachShader(p, f.shader);
    gl.linkProgram(p);
    gl.deleteShader(v.shader);
    gl.deleteShader(f.shader);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      return { program: null, error: gl.getProgramInfoLog(p) || "program link error" };
    }
    return { program: p, error: null };
  }

  function perspective(fovy, aspect, near, far) {
    var f = 1.0 / Math.tan(fovy * 0.5);
    var nf = 1.0 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, (2 * far * near) * nf, 0
    ]);
  }

  function lookAt(eye, center, up) {
    var zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
    var zlen = Math.sqrt(zx*zx + zy*zy + zz*zz) || 1.0;
    var z0 = zx / zlen, z1 = zy / zlen, z2 = zz / zlen;
    var xx = up[1] * z2 - up[2] * z1;
    var xy = up[2] * z0 - up[0] * z2;
    var xz = up[0] * z1 - up[1] * z0;
    var xlen = Math.sqrt(xx*xx + xy*xy + xz*xz) || 1.0;
    var x0 = xx / xlen, x1 = xy / xlen, x2 = xz / xlen;
    var y0 = z1 * x2 - z2 * x1;
    var y1 = z2 * x0 - z0 * x2;
    var y2 = z0 * x1 - z1 * x0;
    return new Float32Array([
      x0, y0, z0, 0,
      x1, y1, z1, 0,
      x2, y2, z2, 0,
      -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]),
      -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]),
      -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]),
      1
    ]);
  }

  function mul4(a, b) {
    var out = new Float32Array(16);
    var c, r;
    for (c = 0; c < 4; c++) {
      for (r = 0; r < 4; r++) {
        out[c * 4 + r] =
          a[0 * 4 + r] * b[c * 4 + 0] +
          a[1 * 4 + r] * b[c * 4 + 1] +
          a[2 * 4 + r] * b[c * 4 + 2] +
          a[3 * 4 + r] * b[c * 4 + 3];
      }
    }
    return out;
  }

  function buildGrid(res) {
    var verts = new Float32Array((res + 1) * (res + 1) * 2);
    var idx = new Uint16Array(res * res * 6);
    var o = 0, z, x;
    for (z = 0; z <= res; z++) {
      for (x = 0; x <= res; x++) {
        verts[o++] = (x / res) * 2.0 - 1.0;
        verts[o++] = (z / res) * 2.0 - 1.0;
      }
    }
    o = 0;
    for (z = 0; z < res; z++) {
      for (x = 0; x < res; x++) {
        var i0 = z * (res + 1) + x;
        var i1 = i0 + 1;
        var i2 = i0 + (res + 1);
        var i3 = i2 + 1;
        idx[o++] = i0; idx[o++] = i2; idx[o++] = i1;
        idx[o++] = i1; idx[o++] = i2; idx[o++] = i3;
      }
    }
    return { verts: verts, idx: idx, indexCount: idx.length, vertexCount: (res + 1) * (res + 1) };
  }

  var pr = makeProgram(
    document.getElementById("vs").textContent,
    document.getElementById("fs").textContent
  );
  if (!pr.program) {
    hud.textContent = pr.error;
    return;
  }
  var program = pr.program;
  gl.useProgram(program);

  var aGrid = gl.getAttribLocation(program, "a_grid");
  var uViewProj = gl.getUniformLocation(program, "u_viewProj");
  var uWorldScale = gl.getUniformLocation(program, "u_worldScale");
  var uHeightScale = gl.getUniformLocation(program, "u_heightScale");
  var uCell = gl.getUniformLocation(program, "u_cell");
  var uCamPos = gl.getUniformLocation(program, "u_camPos");
  var uSeed = gl.getUniformLocation(program, "u_seed");
  var uOffset = gl.getUniformLocation(program, "u_offset");

  var GRID = 96;               // reduced vertex workload
  var WORLD_SCALE = 2200.0;    // keep very wide view
  var HEIGHT_SCALE = 120.0;    // broad hills

  var mesh = buildGrid(GRID);
  var vb = gl.createBuffer();
  var ib = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, mesh.verts, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.idx, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(aGrid);
  gl.vertexAttribPointer(aGrid, 2, gl.FLOAT, false, 0, 0);

  gl.uniform1f(uWorldScale, WORLD_SCALE);
  gl.uniform1f(uHeightScale, HEIGHT_SCALE);
  gl.uniform1f(uCell, (2.0 * WORLD_SCALE) / GRID);

  // Random seed each load => truly generative
  var seedX = Math.random() * 2000.0 + 50.0;
  var seedY = Math.random() * 2000.0 + 100.0;
  gl.uniform2f(uSeed, seedX, seedY);

  gl.enable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);
  gl.clearColor(0.05, 0.08, 0.11, 1.0);

  function resize() {
    var dpr = Math.min(1.0, window.devicePixelRatio || 1.0);
    var w = Math.max(640, Math.floor(window.innerWidth * dpr));
    var h = Math.max(360, Math.floor(window.innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }
  window.addEventListener("resize", resize);
  resize();

  var last = performance.now();
  var fpsEma = 60.0;
  var proj = perspective(54.0 * Math.PI / 180.0, canvas.width / canvas.height, 0.1, 7000.0);

  function frame(now) {
    resize();
    proj = perspective(54.0 * Math.PI / 180.0, canvas.width / canvas.height, 0.1, 7000.0);
    var dt = Math.max(0.001, (now - last) * 0.001);
    last = now;
    fpsEma = fpsEma * 0.92 + (1.0 / dt) * 0.08;

    // Endless forward-flight view: patch follows camera offset
    var t = now * 0.001;
    var camX = t * 210.0;
    var camZ = Math.sin(t * 0.12) * 420.0;
    var yaw = 0.16 * Math.sin(t * 0.08);
    var forward = [Math.cos(yaw), -0.12, Math.sin(yaw)];

    var eye = [camX, 155.0 + 8.0 * Math.sin(t * 0.4), camZ];
    var center = [
      eye[0] + forward[0] * 1300.0,
      eye[1] + forward[1] * 1300.0,
      eye[2] + forward[2] * 1300.0
    ];
    var view = lookAt(eye, center, [0.0, 1.0, 0.0]);
    var vp = mul4(proj, view);

    gl.uniformMatrix4fv(uViewProj, false, vp);
    gl.uniform3f(uCamPos, eye[0], eye[1], eye[2]);
    gl.uniform2f(uOffset, camX, camZ);

    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.drawElements(gl.TRIANGLES, mesh.indexCount, gl.UNSIGNED_SHORT, 0);

    hud.textContent =
      "Perlin Generative Terrain (true 3D mesh)\n" +
      "FPS EMA: " + fpsEma.toFixed(1) + "\n" +
      "Grid: " + GRID + "x" + GRID + "  vertices: " + mesh.vertexCount + "\n" +
      "WorldScale: " + WORLD_SCALE.toFixed(1) + "  HeightScale: " + HEIGHT_SCALE.toFixed(1) + "\n" +
      "Mode: low-frequency rolling hills / deep horizon\n" +
      "Seed: (" + seedX.toFixed(3) + ", " + seedY.toFixed(3) + ")\n" +
      "Field: Perlin + fBm (low freq) + soft domain warp";

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
