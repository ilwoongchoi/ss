<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal Geometry V13: 7-FOLD ORTHOGONAL LOCK</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #fps { position: absolute; top: 10px; left: 10px; color: #00ff00; font-size: 28px; font-weight: bold; z-index: 100; }
        #log { position: absolute; bottom: 20px; left: 20px; color: #00ffff; font-size: 12px; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #00ffff; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="fps">FPS: --</div>
    <div id="log">
        [ UNIVERSAL GEOMETRY: V13 DEFINITIVE LOCK ]<br>
        1D LINEARITY   : Time Flow<br>
        2D ORTHOGONAL  : 7-Fold Bifurcation (2^7=128)<br>
        3D DIAGONAL    : 138.88° PLP Spark<br>
        4D RADIALITY   : The Return (Source Convergence)<br>
        BOUNDARY BAND  : 1/32 (Kappa) to 3/32 (Nose Gate)
    </div>
    <canvas id="gl"></canvas>

    <script id="vs" type="x-shader/x-vertex">
        attribute float a_id;
        uniform float u_time;
        uniform mat4 u_vp;
        varying vec3 v_col;

        const float PI = 3.14159265;
        const float KAPPA = 0.03125;      // 1/32
        const float NOSE_GATE = 0.09375;  // 3/32
        const float ACTION = 0.015625;    // 1/64
        const float LUNAR = 0.035714;     // 1/28
        const float SPARK = 2.4239;       // 138.88 deg
        const float DIPOLE = 1.5714;      // 11/7

        void main() {
            float t = u_time * 0.0005;
            float qt = floor(t / ACTION) * ACTION; // 1/64 Quantization

            // --- 7-FOLD ORTHOGONAL MAPPING (Mandelbrot-style ID Branching) ---
            vec2 pos = vec2(0.0);
            float current_id = a_id;
            float scale = 16.0;
            
            // 128 types are generated by 7 orthogonal decisions
            for(int i=0; i<7; i++) {
                float bit = mod(current_id, 2.0);
                // Each bit rotates the growth vector by 90 degrees (Orthogonal)
                float angle = bit * (PI / 2.0);
                pos += vec2(cos(angle), sin(angle)) * scale;
                current_id = floor(current_id / 2.0);
                scale *= 0.618; // Golden Ratio scaling for fractal folding
            }

            // --- PHYSICAL TRANSITION LOGIC ---
            // 1. 1/28 Lunar Pull Torque
            float torque = LUNAR * qt * mix(1.0, -1.0, step(64.0, a_id));
            mat2 rot = mat2(cos(torque), -sin(torque), sin(torque), cos(torque));
            pos = rot * pos;

            // 2. 1/32 to 3/32 Transition Boundary
            float stress = length(pos) * KAPPA;
            float gate_trigger = step(NOSE_GATE, stress);
            
            // 3. 138.88° Spark & 3D Diagonality
            float spark_angle = (gate_trigger * SPARK);
            mat2 spark_rot = mat2(cos(spark_angle), -sin(spark_angle), sin(spark_angle), cos(spark_angle));
            pos = spark_rot * pos;

            // 4. 4D Radiality (The Return)
            // Mastering the equation: psi^3 - psi - kappa = 0
            float k = stress * 0.1;
            float x = 1.0;
            x = x - (x*x*x - x - k) / (3.0*x*x - 1.0);
            float psi = x - (x*x*x - x - k) / (3.0*x*x - 1.0);
            
            float z = (psi - 1.0) * 20.0;
            
            // Riemann Return: If Z falls below identity threshold, spiral to 0D Source
            float return_trigger = step(z, -15.0);
            z = mix(z, 30.0 - qt * 50.0, return_trigger);
            pos = mix(pos, pos * 0.01, return_trigger);

            vec3 worldPos = vec3(pos.x, z, pos.y);
            gl_Position = u_vp * vec4(worldPos, 1.0);
            
            gl_PointSize = mix(5.0, 2.0, gate_trigger);
            v_col = mix(vec3(0.0, 0.6, 1.0), vec3(1.0, 0.1, 0.4), step(64.0, a_id));
            v_col += gate_trigger * vec3(0.4, 0.4, 0.0); // Transition Glow
        }
    </script>

    <script id="fs" type="x-shader/x-fragment">
        precision lowp float;
        varying vec3 v_col;
        void main() {
            float d = length(gl_PointCoord - 0.5);
            if(d > 0.5) discard;
            gl_FragColor = vec4(v_col, 1.0 - d * 2.0);
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
    <script>
        const canvas = document.getElementById('gl');
        const gl = canvas.getContext('webgl', { antialias: false, depth: true });
        const prog = gl.createProgram();
        const add = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); gl.attachShader(prog, sh); };
        add(gl.VERTEX_SHADER, document.getElementById('vs').text);
        add(gl.FRAGMENT_SHADER, document.getElementById('fs').text);
        gl.linkProgram(prog); gl.useProgram(prog);

        const lVP = gl.getUniformLocation(prog, "u_vp"), lT = gl.getUniformLocation(prog, "u_time");
        const ids = new Float32Array(128); for(let i=0; i<128; i++) ids[i] = i;
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, ids, gl.STATIC_DRAW);
        const aID = gl.getAttribLocation(prog, "a_id"); gl.enableVertexAttribArray(aID); gl.vertexAttribPointer(aID, 1, gl.FLOAT, false, 0, 0);

        gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; gl.viewport(0, 0, canvas.width, canvas.height); };
        window.addEventListener('resize', resize); resize();

        const proj = mat4.create(), view = mat4.create(), vp = mat4.create();
        let frames = 0, lastFPS = 0;

        function render(now) {
            frames++; if (now - lastFPS >= 1000) { document.getElementById('fps').innerText = `FPS: ${frames}`; frames = 0; lastFPS = now; }
            gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            mat4.perspective(proj, Math.PI/4, canvas.width/canvas.height, 0.1, 1000);
            mat4.lookAt(view, [100*Math.cos(now*0.0001), 70, 100*Math.sin(now*0.0001)], [0,0,0], [0,1,0]);
            mat4.multiply(vp, proj, view);
            gl.uniformMatrix4fv(lVP, false, vp); gl.uniform1f(lT, now);
            gl.drawArrays(gl.POINTS, 0, 128);
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    </script>
</body>
</html>
