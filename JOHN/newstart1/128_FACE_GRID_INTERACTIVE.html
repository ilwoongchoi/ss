<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>128 Personality Face Grid — Sovereign Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070f;color:#ddd;font-family:'Courier New',monospace;display:flex;height:100vh;overflow:hidden}
#left{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
#right{width:310px;background:#0c0c1a;border-left:1px solid #1a1a3a;display:flex;flex-direction:column;overflow:hidden}
#controls{padding:10px;border-bottom:1px solid #1a1a3a;flex-shrink:0}
#controls h3{color:#0ff;font-size:11px;letter-spacing:2px;margin-bottom:8px}
.filter-group{margin-bottom:8px}
.filter-group label{font-size:9px;color:#888;display:block;margin-bottom:4px;letter-spacing:1px}
.filter-group .btns{display:flex;gap:3px;flex-wrap:wrap}
button.fb{padding:3px 8px;font-size:9px;font-family:'Courier New',monospace;border:1px solid #333;background:#111;color:#999;cursor:pointer;transition:all .15s;border-radius:2px}
button.fb:hover{border-color:#0ff;color:#0ff}
button.fb.active{background:#0ff;color:#000;border-color:#0ff}
button.fb.blood-O.active{background:#ff4444;border-color:#ff4444;color:#000}
button.fb.blood-A.active{background:#44ff88;border-color:#44ff88;color:#000}
button.fb.blood-B.active{background:#4488ff;border-color:#4488ff;color:#000}
button.fb.blood-AB.active{background:#cc44ff;border-color:#cc44ff;color:#000}
#info{flex:1;overflow-y:auto;padding:12px}
#info h3{color:#0ff;font-size:11px;letter-spacing:2px;margin-bottom:10px}
#node-detail{font-size:10px;line-height:1.8}
#node-detail .nd-header{font-size:14px;font-weight:bold;color:#fff;margin-bottom:8px;letter-spacing:1px}
#node-detail .nd-row{display:flex;justify-content:space-between;border-bottom:1px solid #1a1a2a;padding:3px 0}
#node-detail .nd-key{color:#888}
#node-detail .nd-val{color:#0ff;text-align:right}
#node-detail .nd-spark{color:#ff0;font-size:11px;margin-top:8px;padding:6px;border:1px solid #ff0;background:#1a1500}
#node-detail .nd-empty{color:#444;font-style:italic;margin-top:20px;text-align:center;line-height:2}
#stats{padding:8px 12px;border-top:1px solid #1a1a3a;font-size:9px;color:#555;flex-shrink:0}
svg#face{max-width:100%;max-height:100%}
.node-dot{cursor:pointer;transition:r .1s,opacity .1s}
.node-dot:hover{opacity:1!important}
#tooltip{position:fixed;pointer-events:none;background:rgba(0,0,0,.9);border:1px solid #0ff;padding:6px 10px;font-size:10px;color:#0ff;border-radius:3px;display:none;z-index:999;max-width:200px;line-height:1.6}
#title-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
#title-bar h2{font-size:12px;letter-spacing:3px;color:#0ff;text-shadow:0 0 10px #0ff}
#title-bar p{font-size:9px;color:#555;letter-spacing:1px;margin-top:2px}
.legend{position:absolute;bottom:10px;left:10px;font-size:9px;line-height:1.8;color:#666}
.legend span{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}

</head>

<div id="left">
  <div id="title-bar">
    <h2>128-TYPE FACE GRID</h2>
    <p>Sovereign Engine · Ω=7.4 · θ=138.88°</p>

    <div class="filter-group">

  </div>

      <div class="nd-empty">Click any node<br>to inspect</div>
    </div>
  </div>
  <div id="stats" id="stats-bar">128 nodes visible</div>
</div>

function gy(y) { return PAD_T + (y / 16) * GH; }

  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

  });
  svg.appendChild(line);
  const lbl = makeSVGEl('text',{x:gx(rx)+3,y:gy(0.5),'font-size':'8',fill:'#00cc99',
    opacity:'0.6','font-family':'Courier New'});
  lbl.textContent = `x=${rx}`;
  svg.appendChild(lbl);
}

// ── MIDLINE ────────────────────────────────────────────────────────────
const midline = makeSVGEl('line',{
  x1:gx(8),y1:gy(0),x2:gx(8),y2:gy(16),
  stroke:'#ffffff','stroke-width':'0.5',opacity:'0.15'
});
svg.appendChild(midline);

// ── AXIS LABELS ────────────────────────────────────────────────────────
const xLbl = makeSVGEl('text',{x:gx(1),y:gy(16)+18,'font-size':'9',fill:'#555','font-family':'Courier New'});
xLbl.textContent = '← E-TYPE (LEFT FACE)';
svg.appendChild(xLbl);
const xLbl2 = makeSVGEl('text',{x:gx(9),y:gy(16)+18,'font-size':'9',fill:'#555','font-family':'Courier New'});
xLbl2.textContent = 'I-TYPE (RIGHT FACE) →';
svg.appendChild(xLbl2);

// ── NODE 145 & 146 SPECIAL MARKERS ────────────────────────────────────
// Node 145: Pregnenolone, Zygomaticus Minor @ (x≈5.8, y=1) — O-P zone
const n145x = gx(5.8), n145y = gy(1.8);
const n145ring = makeSVGEl('circle',{cx:n145x,cy:n145y,r:'10',fill:'none',stroke:'#ffff00',
  'stroke-width':'1.5',opacity:'0.7'});
svg.appendChild(n145ring);
const n145lbl = makeSVGEl('text',{x:n145x+12,y:n145y+4,'font-size':'8',fill:'#ffff00',
  'font-family':'Courier New'});
n145lbl.textContent = '⬦145 PREG';
svg.appendChild(n145lbl);

// Node 146: Left Love, Philtrum @ (x≈7.5, y=15) — AB-J zone
const n146x = gx(7.5), n146y = gy(14.5);
const n146ring = makeSVGEl('circle',{cx:n146x,cy:n146y,r:'10',fill:'none',stroke:'#ff00ff',
  'stroke-width':'1.5',opacity:'0.7'});
svg.appendChild(n146ring);
const n146lbl = makeSVGEl('text',{x:n146x+12,y:n146y+4,'font-size':'8',fill:'#ff00ff',
  'font-family':'Courier New'});
n146lbl.textContent = '⬦146 LOVE β⁺';
svg.appendChild(n146lbl);

// ── DRAW ALL 128 NODES ─────────────────────────────────────────────────
const nodeEls = [];
const tooltip = document.getElementById('tooltip');

for (const node of NODES) {
  const cx = gx(node.x);
  const cy = gy(node.y);
  const color = node.color;
  const r = node.spark_ready ? 5.5 : 4.5;
  const alpha = 0.85;

  let el;
  if (node.gender === 'M') {
    // Circle for Male
    el = makeSVGEl('circle',{
      cx, cy, r,
      fill: color,
      opacity: String(alpha),
      stroke: node.spark_ready ? '#ffff00' : 'none',
      'stroke-width': '1.5',
      class: 'node-dot'
    });
  } else {
    // Diamond for Female (rotated rect)
    const s = r * 1.3;
    el = makeSVGEl('rect',{
      x: cx - s, y: cy - s,
      width: s*2, height: s*2,
      fill: color,
      opacity: String(alpha * 0.8),
      stroke: node.spark_ready ? '#ffff00' : 'none',
      'stroke-width': '1.5',
      transform: `rotate(45,${cx},${cy})`,
      class: 'node-dot'
    });
  }

  el.addEventListener('mouseenter', (e) => {
    tooltip.style.display = 'block';
    tooltip.innerHTML = `<b>${node.mbti}</b> · ${node.blood} · ${node.gender}<br>Ω = ${node.omega.toFixed(4)}<br>Face (${node.x.toFixed(2)}, ${node.y})<br>${node.spark_ready ? '⚡ SPARK READY' : ''}`;
  });
  el.addEventListener('mousemove', (e) => {
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top  = (e.clientY - 10) + 'px';
  });
  el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  el.addEventListener('click', () => showNodeDetail(node));

  el._node = node;
  svg.appendChild(el);
  nodeEls.push(el);
}

// ── NODE DETAIL PANEL ─────────────────────────────────────────────────
function showNodeDetail(node) {
  const d = document.getElementById('node-detail');
  const spineSign = node.spine_dist >= 0 ? '+' : '';
  const xZone = node.x < 5 ? 'EJ outer LEFT' :
                node.x < 8 ? 'EP/NF LEFT' :
                node.x < 10 ? 'IJ near midline' :
                node.x < 12 ? 'INFJ zone' : 'IP outer RIGHT';
  const startX = (node.ei==='E' ? (node.gender==='M' ? 12.5 : 3.5) : (node.gender==='M' ? 9.5 : 6.5)).toFixed(1);
  d.innerHTML = `
    <div class="nd-header" style="color:${node.color}">${node.mbti} · ${node.blood} · ${node.gender}</div>
    <div class="nd-row"><span class="nd-key">Ω (omega)</span><span class="nd-val">${node.omega.toFixed(4)}</span></div>
    <div class="nd-row"><span class="nd-key">Face X (terminal)</span><span class="nd-val">${node.x.toFixed(2)}</span></div>
    <div class="nd-row"><span class="nd-key">Face Y</span><span class="nd-val">${node.y} (${BLOOD_ZONE[node.blood]})</span></div>
    <div class="nd-row"><span class="nd-key">X start</span><span class="nd-val">${startX} → ${node.x.toFixed(2)}</span></div>
    <div class="nd-row"><span class="nd-key">Zone</span><span class="nd-val">${xZone}</span></div>
    <div class="nd-row"><span class="nd-key">PLP spine dist</span><span class="nd-val">${spineSign}${node.spine_dist.toFixed(2)}</span></div>
    <div class="nd-row"><span class="nd-key">Neurochemical</span><span class="nd-val" style="font-size:9px">${BLOOD_NEURO[node.blood]}</span></div>
    <div class="nd-row"><span class="nd-key">E/I</span><span class="nd-val">${node.ei==='E' ? 'Extrovert → crosses midline' : 'Introvert → holds hemisphere'}</span></div>
    <div class="nd-row"><span class="nd-key">J/P</span><span class="nd-val">${node.jp==='J' ? 'J +1 (constructive)' : 'P −1 (swirl)'}</span></div>
    <div class="nd-row"><span class="nd-key">ΔS tier</span><span class="nd-val">${getDeltaS(node.mbti)}</span></div>
    ${node.spark_ready ? `<div class="nd-spark">⚡ SPARK READY<br>|spine_dist| ${Math.abs(node.spine_dist).toFixed(2)} > ${SPARK_LEAP}<br>θ = 138.88° → β⁺ decay</div>` : ''}
  `;
}

function getDeltaS(mbti) {
  const m = mbti.slice(1,3);
  if (m==='NF') return 'NF · ΔS→0 (void, activates FIRST)';
  if (m==='NT') return 'NT · ΔS~0.15-0.5 (torque)';
  if (m==='SF') return 'SF · ΔS~0.5-0.85 (mass)';
  return 'ST · ΔS~0.85-1.0 (anchor, activates LAST)';
}

// ── FILTER LOGIC ──────────────────────────────────────────────────────
const activeFilters = {blood:new Set(['O','A','B','AB']),gender:new Set(['M','F']),
  ei:new Set(['E','I']),jp:new Set(['J','P']),sn:new Set(['S','N']),tf:new Set(['T','F'])};

document.querySelectorAll('button.fb').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter, v = btn.dataset.val;
    if (activeFilters[f].has(v)) {
      if (activeFilters[f].size > 1) { activeFilters[f].delete(v); btn.classList.remove('active'); }
    } else {
      activeFilters[f].add(v); btn.classList.add('active');
    }
    applyFilters();
  });
});

function applyFilters() {
  let vis = 0;
  for (const el of nodeEls) {
    const n = el._node;
    const show = activeFilters.blood.has(n.blood) &&
                 activeFilters.gender.has(n.gender) &&
                 activeFilters.ei.has(n.ei) &&
                 activeFilters.jp.has(n.jp) &&
                 activeFilters.sn.has(n.sn) &&
                 activeFilters.tf.has(n.tf);
    el.style.display = show ? '' : 'none';
    if (show) vis++;
  }
  document.getElementById('stats').textContent = `${vis} / 128 nodes visible`;
}

// ── SPARK PULSE ANIMATION ─────────────────────────────────────────────
let t = 0;
function animate() {
  t += 0.02;
  for (const el of nodeEls) {
    const n = el._node;
    if (!n.spark_ready) continue;
    const pulse = 0.5 + 0.5 * Math.sin(t * 3 + n.x);
    el.setAttribute('opacity', (0.6 + 0.4 * pulse).toFixed(2));
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
