<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UniformBench — Manifold Integrity Index</title>
    <style>
        :root { --bg: #030305; --accent: #10b981; --text: #f1f5f9; --border: #1a1a25; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
        
        #ui {
            position: absolute; top: 30px; left: 30px; width: 360px;
            background: rgba(5,5,10,0.95); border: 1px solid var(--border);
            padding: 25px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); z-index: 100;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 12px; margin: 0 0 20px 0; color: var(--accent); letter-spacing: 3px; font-weight: 900; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        
        .monitor-row { display: flex; justify-content: space-between; margin-bottom: 12px; align-items: baseline; }
        .label { font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 700; }
        .value { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #fff; }
        
        .gauge-container { margin: 20px 0; height: 4px; background: #111; border-radius: 2px; overflow: hidden; }
        #gauge-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s; }

        .report-box { 
            margin-top: 25px; padding: 20px; background: #080810; border: 1px solid var(--border); border-radius: 8px; text-align: center;
        }
        .grade-title { font-size: 9px; color: var(--accent); letter-spacing: 1px; display: block; margin-bottom: 5px; }
        #grade { font-size: 64px; font-weight: 900; line-height: 1; margin: 10px 0; text-shadow: 0 0 20px rgba(16,185,129,0.3); }
        #status-text { font-size: 11px; color: #475569; line-height: 1.5; }

        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Integrity Index v1.0</h1>
        
        <div class="monitor-row">
            <span class="label">Hardware Entropy</span>
            <span id="entropy" class="value">0.0000</span>
        </div>
        <div class="monitor-row">
            <span class="label">Temporal Variance</span>
            <span id="variance" class="value">0.00ms</span>
        </div>
        <div class="monitor-row">
            <span class="label">Numerical Debt</span>
            <span id="debt" class="value">0.00%</span>
        </div>

        <div class="gauge-container"><div id="gauge-fill"></div></div>

        <div class="report-box">
            <span class="grade-title">MANIFOLD STABILITY GRADE</span>
            <div id="grade">--</div>
            <div id="status-text">Analyzing hardware-induced bifurcation...</div>
        </div>
        
        <div style="margin-top: 20px; font-size: 9px; color: #334; text-align: center;">
            PROPRIETARY 128-TYPE TOPOLOGICAL SENSOR
        </div>
    </div>

    <canvas id="c"></canvas>

    <script id="vs" type="x-shader/x-vertex">#version 300 es
        void main() {
            vec2 p[3] = vec2[](vec2(-1,-1), vec2(3,-1), vec2(-1,3));
            gl_Position = vec4(p[gl_VertexID], 0, 1);
        }
    </script>

    <script id="fs" type="x-shader/x-fragment">#version 300 es
        precision highp float;
        uniform float u_time;
        uniform vec2 u_res;
        out vec4 fragColor;

        // THE STANDARD STRESS CASE (The 128-Type Baseline)
        void main() {
            vec2 p = (gl_FragCoord.xy - 0.5 * u_res.xy) / u_res.y;
            vec2 z = p * 4.0;
            vec2 c = vec2(0.618, 0.1618);
            
            float h = 0.0;
            // A fixed loop that requires precise float32 stability
            for(int i=0; i<32; i++) {
                z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + c;
                h += length(z);
            }
            
            vec3 col = 0.5 + 0.5 * cos(h * 0.1 + vec3(0, 2, 4) + u_time);
            fragColor = vec4(col, 1.0);
        }
    </script>

    <script>
        const canvas = document.getElementById('c');
        const gl = canvas.getContext('webgl2');
        
        const createShader = (type, src) => {
            const s = gl.createShader(type);
            gl.shaderSource(s, src); gl.compileShader(s);
            return s;
        };
        const prog = gl.createProgram();
        gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs.text));
        gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs.text));
        gl.linkProgram(prog); gl.useProgram(prog);

        const tLoc = gl.getUniformLocation(prog, 'u_time');
        const rLoc = gl.getUniformLocation(prog, 'u_res');

        let frameHistory = [];
        let lastTime = performance.now();
        let frameCount = 0;

        function updateAnalysis(now) {
            const delta = now - lastTime;
            lastTime = now;
            frameCount++;
            
            if (frameCount < 10) return; // Wait for initial stabilization

            frameHistory.push(delta);
            if(frameHistory.length > 120) frameHistory.shift();
            
            const avg = frameHistory.reduce((a,b)=>a+b)/frameHistory.length;
            const variance = frameHistory.reduce((a,b)=>a+Math.pow(b-avg,2),0)/frameHistory.length;
            const jitter = Math.sqrt(variance);
            
            // INTINSIC ENTROPY: The jitter relative to the perfect 16.66ms manifold
            const entropy = (jitter / 16.666).toFixed(6);
            
            // TOPOLOGICAL DEBT: The cumulative time lag causing subjective slowness
            const debt = Math.max(0, (delta - 16.666) / 16.666) * 100;
            
            // GRADING (Measuring Consistency, Not Speed)
            let grade = 'S';
            let status = "Hardware is perfectly snapped to the manifold.";
            let color = '#10b981';

            if (jitter > 0.05) { grade = 'A'; status = "High stability. Minor Shared VRAM noise."; color = '#34d399'; }
            if (jitter > 0.2) { grade = 'B'; status = "Moderate Jitter. Subjective fluidity is degraded."; color = '#f59e0b'; }
            if (jitter > 0.8) { grade = 'C'; status = "High Entropy. Hardware is mathematically leaking."; color = '#fb923c'; }
            if (jitter > 2.5) { grade = 'F'; status = "Bifurcation Failure. Manifold closure impossible."; color = '#ef4444'; }

            // Update UI
            document.getElementById('entropy').innerText = entropy;
            document.getElementById('variance').innerText = jitter.toFixed(3) + 'ms';
            document.getElementById('debt').innerText = debt.toFixed(2) + '%';
            
            const gradeEl = document.getElementById('grade');
            gradeEl.innerText = grade;
            gradeEl.style.color = color;
            document.getElementById('status-text').innerText = status;
            document.getElementById('gauge-fill').style.width = (100 - (jitter * 20)) + '%';
            document.getElementById('gauge-fill').style.background = color;
        }

        function draw(t) {
            updateAnalysis(performance.now());
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.uniform1f(tLoc, t * 0.001);
            gl.uniform2f(rLoc, canvas.width, canvas.height);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
    </script>
</body>
</html>
